# DeskPulse machine-wide default rules
#
# This file is installed under Program Files and is replaced when DeskPulse is
# upgraded. Test local changes in the ProgramData administrator override file,
# then promote proven rules into this source-controlled default file.
#
# Rules are evaluated from top to bottom. Administrator override rules are
# evaluated before these defaults. The first matching rule wins.

version: 1

rules:
  - id: windows-installation-tree
    revision: 1
    enabled: true
    visible_in_ui: true
    type: path
    action: exclude
    value: "%WINDIR%"
    reason: "Suppress routine activity below the Windows installation folder."

  - id: windows-error-reporting
    revision: 1
    enabled: true
    visible_in_ui: true
    type: path
    action: exclude
    value: "%ProgramData%\\Microsoft\\Windows\\WER"
    reason: "Suppress Windows Error Reporting background files."

  - id: windows-defender-data
    revision: 1
    enabled: true
    visible_in_ui: true
    type: path
    action: exclude
    value: "%ProgramData%\\Microsoft\\Windows Defender"
    reason: "Suppress routine Microsoft Defender data activity."

  - id: windows-search-data
    revision: 1
    enabled: true
    visible_in_ui: true
    type: path
    action: exclude
    value: "%ProgramData%\\Microsoft\\Search"
    reason: "Suppress Windows Search index data."

  - id: recycle-bin
    revision: 1
    enabled: true
    visible_in_ui: true
    type: path
    action: exclude
    value: "%SystemDrive%\\$Recycle.Bin"
    reason: "Suppress Recycle Bin housekeeping."

  - id: windows-background-processes
    revision: 1
    enabled: true
    visible_in_ui: true
    type: process
    action: exclude
    values:
      - SearchIndexer
      - SearchProtocolHost
      - SearchFilterHost
      - MsMpEng
      - CompatTelRunner
      - svchost
      - RuntimeBroker
      - TiWorker
      - TrustedInstaller
      - MoUsoCoreWorker
      - UsoClient
      - WerFault
      - System
    reason: "Suppress routine Windows services and background processes."
